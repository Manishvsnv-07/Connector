<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="40" height="40">

  <!-- Glow -->
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- White circle with subtle outline -->
  <circle 
    cx="256" 
    cy="256" 
    r="110" 
    fill="#ffffff" 
    stroke="#e5e7eb" 
    stroke-width="6"
    filter="url(#glow)"
  />

  <!-- Tick -->
  <path 
    d="M220 260 L250 290 L310 220"
    fill="none"
    stroke="#ab9ff2"
    stroke-width="16"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

</svg>